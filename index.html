<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Image Gallery</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <h1>Anime Image Gallery</h1>
        <p>Explore Your Favorite Anime Collection</p>
    </header>

    <section class="gallery">

        <img src="images/images.jpg" alt="Anime 2" class="gallery-item" loading="lazy">
        
        <img src="images/images (1).jpg" alt="Anime 2" class="gallery-item" loading="lazy">

        <img src="images/images (2).jpg" alt="Anime 3" class="gallery-item" loading="lazy">

        <img src="images/images (3).jpg" alt="Anime 4" class="gallery-item" loading="lazy">

        <img src="images/images (4).jpg" alt="Anime 5" class="gallery-item" loading="lazy">

        <img src="images/images (5).jpg" alt="Anime 6" class="gallery-item" loading="lazy">

        <img src="images/images (6).jpg" alt="Anime 7" class="gallery-item" loading="lazy">

        <img src="images/images (7).jpg" alt="Anime 8" class="gallery-item" loading="lazy">

        <img src="images/images (8).jpg" alt="Anime 9" class="gallery-item" loading="lazy">

        <img src="images/images (9).jpg" alt="Anime 10" class="gallery-item" loading="lazy">

        <img src="images/images (10).jpg" alt="Anime 11" class="gallery-item" loading="lazy">

        <img src="images/images (11).jpg" alt="Anime 12" class="gallery-item" loading="lazy">

        <img src="images/images (12).jpg" alt="Anime 13" class="gallery-item" loading="lazy">

        <img src="images/images (13).jpg" alt="Anime 14" class="gallery-item" loading="lazy">

        <img src="images/images (14).jpg" alt="Anime 15" class="gallery-item" loading="lazy">

        <img src="images/images (15).jpg" alt="Anime 16" class="gallery-item" loading="lazy">

        <img src="images/images (16).jpg" alt="Anime 17" class="gallery-item" loading="lazy">

        <img src="images/images (17).jpg" alt="Anime 18" class="gallery-item" loading="lazy">

        <img src="images/images (18).jpg" alt="Anime 19" class="gallery-item" loading="lazy">

    </section>

    <!-- Lightbox -->

    <div class="lightbox">

        <span class="close">&times;</span>

        <button class="prev">&#10094;</button>

        <img class="lightbox-img" src="" alt="">

        <button class="next">&#10095;</button>

        <div class="counter"></div>

    </div>

    <!-- Scroll to Top Button -->

    <button id="topBtn">↑</button>

    <script src="script.js"></script>

</body>

</html>
